<h1>5.1 기능별로 다섯 종류를 추가했다</h1>
<figure class="tall"><img src="../archive_v1/fig/ch11_view_iso.png" alt="기말 조립체: 중간 구조를 계승하고 적층 공구를 추가한 대기 배치."><figcaption>기말 조립체: 중간 구조를 계승하고 적층 공구를 추가한 대기 배치.</figcaption></figure><table><thead><tr><th>기능 묶음</th><th>추가 목적</th></tr></thead><tbody><tr><td>적층 척 / 리플로우 척</td><td>하부 관찰·지지 / 스택 일괄 가열</td></tr><tr><td>가압 지그·플런저</td><td>수지 공급과 압력 전달</td></tr><tr><td>디스펜서 / NCF 트레이</td><td>MUF 계량 공급 / 필름 부착 다이 공급</td></tr></tbody></table><p>다섯 종류는 기능 묶음이다. CAD 부품은 중간 43개에 신규 8개를 더한 51개로 집계한다. 공구의 대기 배치가 실제 운전 중 동시 장착·이송을 뜻하지 않는다.</p>
