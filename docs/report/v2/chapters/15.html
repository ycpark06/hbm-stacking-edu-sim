<h1>6.2 HMI는 입력·알람·복구를 연결한다</h1>
<figure><img src="../../../media/stills/light/hmi_light_top.png" alt="웹 HMI 저장 화면. 실행 결과와 입력 조건을 함께 확인한다."><figcaption>웹 HMI 저장 화면. 실행 결과와 입력 조건을 함께 확인한다.</figcaption></figure><figure><img src="../../../media/stills/light/hmi_light_alarms.png" alt="알람 저장 화면. 미달·레시피 거부와 수동 복귀를 구분한다."><figcaption>알람 저장 화면. 미달·레시피 거부와 수동 복귀를 구분한다.</figcaption></figure><p>레시피를 검증한 뒤 Worker가 계산과 진행 이벤트를 보낸다. 기준 응답과 별도 FIRMWARE 고장 주입 인스턴스를 나눠 보호 상태를 본다. 복귀는 조건 해제 후 수동 리셋으로 수행한다.</p><p>층별 비전은 NCC·서브픽셀·평탄화·아핀 보정의 흐름을 보여 준다. 합성 영상의 검출 오차와 정합 예산, 누적 위치 표본을 같은 통계로 합치지 않는다.</p>
