<h1>5.6 색으로 기능을 나누고<br>분해도로 구성을 읽는다</h1>
<div class="cad-key"><span class="stack">적층 척</span><span class="reflow">리플로우 척</span><span class="mold">가압 충전 지그·플런저</span><span class="dispenser">디스펜서</span><span class="tray">NCF 트레이</span></div>
<figure><img src="../../../media/stills/light/cad_light_all.png" alt="추가 장치 다섯 기능을 자기 색으로 표시한 전체 조립체"><figcaption>전체 색 보기 · 모든 그룹을 불투명하게 표시한다. 색은 기능 구분용 표시 설정이며 재질·온도·판정값이 아니다.</figcaption></figure>
<figure><img src="../../../media/stills/light/cad_light_exploded.png" alt="교육용 적층 본더 그룹별 분해 표시"><figcaption>분해 표시 · 이동 방향과 거리는 표시 설정이다. 실제 조립 순서·작동 행정·이송 궤적을 나타내지 않는다.</figcaption></figure>
<p>적층 척은 층별 지지와 하부 관찰, 리플로우 척은 일괄 가열, 지그·플런저는 가압 충전을 맡는다. 디스펜서는 수지 공급, NCF 트레이는 필름 부착 다이 공급을 설명한다.</p>
