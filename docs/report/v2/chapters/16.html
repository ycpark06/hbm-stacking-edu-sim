<h1>6.3 CAD와 공장 화면은<br>계산 이력을 설명한다</h1>
<figure><img src="../../../media/stills/light/cad_light_all.png" alt="CAD 페이지 저장 캡처. 그룹 이름과 도면·다운로드 연결."><figcaption>CAD 페이지 저장 캡처. 그룹 이름과 도면·다운로드 연결.</figcaption></figure><figure><img src="../../../media/stills/light/factory_light_mr_reflow.png" alt="공장 페이지 저장 캡처. 공정 단계와 저장 계산값을 재생한다."><figcaption>공장 페이지 저장 캡처. 공정 단계와 저장 계산값을 재생한다.</figcaption></figure><p>다 쌓은 스택은 일괄 리플로우 단계로 넘어간다. 화면의 이동은 공정 흐름을 설명하기 위한 연출이며 실제 이송 궤적 검증이 아니다. 애니메이션 시간도 물리 계산 시간과 다르다.</p><p>배포 전 Node 시험을 거쳐 공개 자산을 조립한다. CAD의 정지 자세 간섭 검사와 웹 움직임을 전 스트로크 충돌 검증으로 읽지 않는다.</p>
