<figcaption>STEP과 STL은 같은 Fusion 조립체에서 각각 출력한다. 화살표는 산출물 제작 순서이며 STEP을 STL 입력으로 다시 읽는 변환은 아니다.</figcaption></figure>
<p>개별 부품 바디의 이름은 Fusion 하위 컴포넌트와 <code>summary.json parts</code>에 남긴다. 현재 STL은 바디를 그룹별로 묶은 파일이다. GLB는 이 그룹을 유지해 선택·숨김·분해 표시를 연결한다.</p>
