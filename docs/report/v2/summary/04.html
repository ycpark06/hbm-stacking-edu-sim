<h1>공통 제어기와 웹 표시</h1>
<p>본보고서 6장. C 제어기는 PC·MCU·wasm으로 빌드하며 웹에서 JS 플랜트와 독립 SIL을 수행한다.</p><figure><img src="../archive_v1/fig/ch16_architecture.png" alt="공통 소스·HAL·적층 계산·화면의 관계."><figcaption>공통 소스·HAL·적층 계산·화면의 관계.</figcaption></figure><figure><img src="../../../media/stills/factory_overview.png" alt="공장 페이지 저장 화면. 공정 흐름용 이동 연출을 포함한다."><figcaption>공장 페이지 저장 화면. 공정 흐름용 이동 연출을 포함한다.</figcaption></figure><p>스택 열 계산의 이상 헤드 경계는 출력 제한 제어와 직접 결합하지 않았다. MCU 빌드도 실물 HAL·센서·서보 검증과 별개다. PG0 외 신호는 배선 설계값이다.</p>
